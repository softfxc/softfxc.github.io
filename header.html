<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Component</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .header {
            background-color: pink;
            padding: 10px;
            text-align: center;
        }
        .menu {
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
            list-style-type: none;
        }
        .menu-item {
            margin: 0 15px;
        }
        .search-container {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Soft FXC</h1>
        <ul class="menu">
            <li class="menu-item"><a href="https://github.com/softfxc/discussions">FAQ</a></li>
        </ul>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search across Soft FXC repos...">
            <button id="search-button" onclick="searchCode()">Search</button>
        </div>
    </header>
    <script>
        async function searchCode() {
            const query = document.getElementById('search-input').value;
            const url = `https://api.github.com/search/code?q=user:softfxc+is:public+${encodeURIComponent(query)}`;
            const response = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
            const data = await response.json();
            console.log(data);
        }
    </script>
</body>
</html>
